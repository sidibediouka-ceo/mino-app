name: Mino
options:
  bundleIdPrefix: app.mino
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

packages:
  MinoKit:
    path: MinoKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mino:
    type: application
    platform: iOS
    sources:
      - path: Mino
    dependencies:
      - package: MinoKit
    entitlements:
      path: Mino/Mino.entitlements
      properties:
        com.apple.developer.weatherkit: true
    info:
      path: Mino/Info.plist
      properties:
        CFBundleDisplayName: Mino
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Mino utilise l'appareil photo pour ajouter les vêtements de vos enfants et lire leurs étiquettes. Les photos restent sur votre iPhone."
        NSLocationWhenInUseUsageDescription: "Mino utilise votre position approximative pour adapter les tenues à la météo. Elle n'est jamais enregistrée."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mino.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
